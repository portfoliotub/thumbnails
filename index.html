<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Kali — YouTube thumbnail design samples.">
  <link rel="icon" href="data:,">
  <title>Kali — Thumbnails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* v4 (2026-11-14): orange + white, professional, 3D.
       One 2-column grid, all 47 thumbnails together — no sections, no extra text.
       Cards are white frames with layered shadows; hover / pointer tilt gives the 3D depth. */
    :root {
      --orange: #ff6a00;
      --orange-deep: #d95500;
      --orange-soft: #fff1e6;
      --ink: #161616;
      --line: #f0edea;
      --shadow: 0 1px 2px rgba(22, 22, 22, 0.05),
                0 10px 24px rgba(22, 22, 22, 0.08),
                0 28px 56px rgba(255, 106, 0, 0.10);
      --shadow-hover: 0 2px 4px rgba(22, 22, 22, 0.06),
                      0 18px 36px rgba(22, 22, 22, 0.13),
                      0 44px 88px rgba(255, 106, 0, 0.24);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
    body {
      margin: 0;
      background: #ffffff;
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .topbar { height: 4px; background: linear-gradient(90deg, var(--orange), #ff9a3d 60%, var(--orange)); }
    header {
      max-width: 1080px; margin: 0 auto;
      padding: 26px 20px 4px;
      display: flex; align-items: center; gap: 11px;
    }
    .mark {
      width: 13px; height: 13px; flex: none;
      background: var(--orange);
      border-radius: 3px;
      box-shadow: 2px 2px 0 var(--orange-deep);
    }
    .wordmark { font-weight: 800; font-size: 21px; letter-spacing: 0.16em; line-height: 1; }
    .wordmark b { color: var(--orange); font-weight: 800; }

    /* ---------- 2-column grid ---------- */
    .grid {
      max-width: 1080px; margin: 0 auto;
      padding: 22px 20px 72px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      perspective: 1400px;
    }
    .card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.22, 0.9, 0.28, 1.25),
                  box-shadow 0.4s ease,
                  border-color 0.3s ease;
      will-change: transform;
    }
    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #111111;
      border-radius: 10px;
      transform: translateZ(26px);
    }
    .card:hover, .card.tilted {
      border-color: rgba(255, 106, 0, 0.45);
      box-shadow: var(--shadow-hover);
    }
    @media (max-width: 520px) {
      .grid { gap: 12px; padding: 16px 12px 56px; }
      .card { border-radius: 12px; padding: 7px; }
      .card img { border-radius: 8px; }
      header { padding: 20px 14px 2px; }
    }

    /* ---------- lightbox ---------- */
    .lightbox {
      position: fixed; inset: 0; z-index: 10;
      display: none; align-items: center; justify-content: center;
      background: rgba(16, 12, 8, 0.94); padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 94vw; max-height: 86vh;
      object-fit: contain; background: #000;
      border-radius: 6px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 106, 0, 0.35);
    }
    .lb-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
      background: transparent; color: #fff;
      font-size: 20px; cursor: pointer;
    }
    .lb-btn:hover { background: rgba(255, 106, 0, 0.35); border-color: var(--orange); }
    .lb-prev { left: 16px; } .lb-next { right: 16px; }
    .lb-close {
      position: absolute; top: 16px; right: 16px;
      width: 40px; height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
      background: transparent; color: #fff; font-size: 18px; cursor: pointer;
    }
    .lb-close:hover { background: rgba(255, 106, 0, 0.35); border-color: var(--orange); }
    @media (max-width: 560px) { .lb-prev { left: 6px; } .lb-next { right: 6px; } }
  </style>
</head>
<body>
  <div class="topbar" aria-hidden="true"></div>
  <header>
    <span class="mark" aria-hidden="true"></span>
    <span class="wordmark">KALI<b>.</b></span>
  </header>

  <main class="grid" id="grid" aria-label="Thumbnail samples"></main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Thumbnail preview">
    <button class="lb-close" id="lb-close" type="button" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Previous">‹</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Next">›</button>
  </div>

  <script>
    (function () {
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var GROUPS = [
        { slug: "casino", count: 15 },
        { slug: "roblox", count: 6 },
        { slug: "general", count: 26 }
      ];
      var items = [];
      GROUPS.forEach(function (g) {
        for (var i = 1; i <= g.count; i++) {
          var n = ("0" + i).slice(-2);
          items.push({ src: "img/" + g.slug + "-" + n + ".jpg", alt: g.slug + " " + n + " thumbnail" });
        }
      });

      var grid = document.getElementById("grid");
      items.forEach(function (it, i) {
        var card = document.createElement("article");
        card.className = "card";
        card.innerHTML = '<img src="' + it.src + '" alt="' + it.alt + '" decoding="async">';
        card.addEventListener("click", function () { show(i); });
        grid.appendChild(card);
      });
      var cards = Array.prototype.slice.call(grid.querySelectorAll(".card"));

      /* ---------- 3D pointer tilt (mouse/pen only — touch drags scroll, never tilt) ---------- */
      if (!reduceMotion) {
        cards.forEach(function (card) {
          card.addEventListener("pointermove", function (e) {
            if (e.pointerType && e.pointerType !== "mouse" && e.pointerType !== "pen") return;
            var r = card.getBoundingClientRect();
            var px = (e.clientX - r.left) / r.width - 0.5;
            var py = (e.clientY - r.top) / r.height - 0.5;
            card.classList.add("tilted");
            card.style.transform =
              "translateY(-8px) rotateX(" + (-py * 7).toFixed(2) + "deg) rotateY(" + (px * 7).toFixed(2) + "deg)";
          });
          card.addEventListener("pointerleave", function () {
            card.classList.remove("tilted");
            card.style.transform = "";
          });
        });
      }

      /* ---------- lightbox ---------- */
      var box = document.getElementById("lightbox"),
          lbImg = document.getElementById("lb-img"),
          lbCurrent = -1;
      function show(i) {
        if (!items.length) return;
        lbCurrent = ((i % items.length) + items.length) % items.length;
        var it = items[lbCurrent];
        lbImg.src = it.src;
        lbImg.alt = it.alt;
        box.classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function close() { box.classList.remove("open"); document.body.style.overflow = ""; }
      document.getElementById("lb-close").addEventListener("click", close);
      document.getElementById("lb-prev").addEventListener("click", function (e) { e.stopPropagation(); show(lbCurrent - 1); });
      document.getElementById("lb-next").addEventListener("click", function (e) { e.stopPropagation(); show(lbCurrent + 1); });
      box.addEventListener("click", function (e) { if (e.target === box) close(); });
      document.addEventListener("keydown", function (e) {
        if (!box.classList.contains("open")) return;
        if (e.key === "Escape") close();
        else if (e.key === "ArrowLeft") show(lbCurrent - 1);
        else if (e.key === "ArrowRight") show(lbCurrent + 1);
      });
    })();
  </script>
</body>
</html>
