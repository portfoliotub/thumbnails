  <style>
    :root { --ink: #111; --muted: #777; --line: #e5e5e5; --bg: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 56px 24px 64px; }
    header { margin-bottom: 40px; }
    .kicker { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
    h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1.05; margin: 0 0 12px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 20px; max-width: 34em; }
    .mail { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); font-size: 15px; }
    .mail:hover { color: var(--muted); border-color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 16px 0; margin-bottom: 32px;
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .filter { appearance: none; background: none; border: 0; padding: 4px 0; cursor: pointer;
      font: inherit; font-size: 15px; color: var(--muted); }
    .filter span { font-size: 12px; color: #bbb; }
    .filter:hover { color: var(--ink); }
    .filter.active { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
    .grid { columns: 3; column-gap: 20px; }
    @media (max-width: 900px) { .grid { columns: 2; } }
    @media (max-width: 560px) { .grid { columns: 1; } .wrap { padding-top: 40px; } }
    .item { break-inside: avoid; margin: 0 0 28px; }
    .item.hidden { display: none; }
    .thumb { display: block; width: 100%; padding: 0; border: 0; background: #f4f4f4; cursor: zoom-in; }
    .thumb img { display: block; width: 100%; height: auto; }
    .thumb:hover img { opacity: .92; }
    figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; }
    footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); }
    .lightbox { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,.93); padding: 20px; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 94vw; max-height: 86vh; object-fit: contain; background: #000; }
    .lightbox .cap { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; color: #ccc; font-size: 14px; }
    .lb-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;
      border: 1px solid rgba(255,255,255,.4); border-radius: 50%; background: transparent; color: #fff;
      font-size: 20px; cursor: pointer; }
    .lb-btn:hover { background: rgba(255,255,255,.12); }
    .lb-prev { left: 16px; } .lb-next { right: 16px; }
    .lb-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.4);
      border-radius: 50%; background: transparent; color: #fff; font-size: 18px; cursor: pointer; }
    @media (max-width: 560px) { .lb-prev { left: 6px; } .lb-next { right: 6px; } }
  </style>

  <script>
    (function () {
      var items = Array.prototype.slice.call(document.querySelectorAll(".item"));
      document.querySelectorAll(".filter").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".filter").forEach(function (b) { b.classList.remove("active"); });
          btn.classList.add("active");
          var f = btn.getAttribute("data-filter");
          items.forEach(function (it) {
            it.classList.toggle("hidden", f !== "all" && it.getAttribute("data-group") !== f);
          });
        });
      });
      var box = document.getElementById("lightbox"),
          img = document.getElementById("lb-img"),
          cap = document.getElementById("lb-cap"),
          current = -1;
      function visible() { return items.filter(function (it) { return !it.classList.contains("hidden"); }); }
      function show(i) {
        var list = visible();
        if (!list.length) return;
        current = ((i % list.length) + list.length) % list.length;
        var b = list[current].querySelector(".thumb");
        img.src = b.getAttribute("data-full");
        img.alt = b.getAttribute("data-caption") + " thumbnail";
        cap.textContent = b.getAttribute("data-caption");
        box.classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function close() { box.classList.remove("open"); document.body.style.overflow = ""; }
      items.forEach(function (it) {
        it.querySelector(".thumb").addEventListener("click", function () { show(visible().indexOf(it)); });
      });
      document.getElementById("lb-close").addEventListener("click", close);
      document.getElementById("lb-prev").addEventListener("click", function (e) { e.stopPropagation(); show(current - 1); });
      document.getElementById("lb-next").addEventListener("click", function (e) { e.stopPropagation(); show(current + 1); });
      box.addEventListener("click", function (e) { if (e.target === box) close(); });
      document.addEventListener("keydown", function (e) {
        if (!box.classList.contains("open")) return;
        if (e.key === "Escape") close();
        else if (e.key === "ArrowLeft") show(current - 1);
        else if (e.key === "ArrowRight") show(current + 1);
      });
    })();
  </script>
</body>
</html>
